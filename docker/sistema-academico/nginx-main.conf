# Nginx main configuration for non-root user
# This replaces the default /etc/nginx/nginx.conf

# Don't run as daemon since supervisord handles this
# Don't run as daemon since supervisord handles this
# daemon off; (Commented out to avoid duplicate directive error if passed via CLI)

# Worker settings
worker_processes auto;
pid /tmp/nginx.pid;

# Error log to stderr (for Docker)
error_log /dev/stderr warn;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # Temp directories in /tmp (writable by anyone)
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    # Basic settings
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /dev/stdout;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Include server configs
    include /etc/nginx/http.d/*.conf;
}
