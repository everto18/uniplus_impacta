name: CI/CD Pipeline - Development

on:
  push:
    branches:
      - 'dev*'      # Branches that start with 'dev' (dev, develop, dev-feature, etc.)
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests'
        required: false
        default: false
        type: boolean

env:
  AWS_REGION: 'sa-east-1'
  TF_VERSION: '1.10.0'
  PYTHON_VERSION: '3.12'

permissions:
  id-token: write
  contents: write
  pull-requests: write
  security-events: write

# Evita execuções paralelas do mesmo workflow na mesma branch
concurrency:
  group: ci-cd-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # STAGE 0: Read Pipeline Configuration
  # ============================================
  config:
    name: Read Config
    runs-on: ubuntu-latest
    outputs:
      testes_unitarios: ${{ steps.config.outputs.testes_unitarios }}
      sonarqube: ${{ steps.config.outputs.sonarqube }}
      docker_build: ${{ steps.config.outputs.docker_build }}
      security_scan: ${{ steps.config.outputs.security_scan }}
      deploy_dev: ${{ steps.config.outputs.deploy_dev }}
      testes_integracao: ${{ steps.config.outputs.testes_integracao }}
      create_pr: ${{ steps.config.outputs.create_pr }}
      tf_init: ${{ steps.config.outputs.tf_init }}
      tf_plan: ${{ steps.config.outputs.tf_plan }}
      tf_apply: ${{ steps.config.outputs.tf_apply }}
      tf_destroy: ${{ steps.config.outputs.tf_destroy }}
      slack: ${{ steps.config.outputs.slack }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse .iupipes config
        id: config
        run: |
          if [ -f ".iupipes" ]; then
            echo "📄 Reading .iupipes configuration..."
            
            # Function to read config value
            get_config() {
              grep -E "^$1\s*=" .iupipes | sed 's/.*=\s*//' | tr -d ' ' | tr '[:upper:]' '[:lower:]'
            }
            
            # Pipeline settings
            echo "testes_unitarios=$(get_config 'testes_unitarios')" >> $GITHUB_OUTPUT
            echo "sonarqube=$(get_config 'sonarqube')" >> $GITHUB_OUTPUT
            echo "docker_build=$(get_config 'docker_build')" >> $GITHUB_OUTPUT
            echo "security_scan=$(get_config 'security_scan')" >> $GITHUB_OUTPUT
            echo "deploy_dev=$(get_config 'deploy_dev')" >> $GITHUB_OUTPUT
            echo "testes_integracao=$(get_config 'testes_integracao')" >> $GITHUB_OUTPUT
            echo "create_pr=$(get_config 'create_pr')" >> $GITHUB_OUTPUT
            
            # Terraform settings
            echo "tf_init=$(get_config 'init')" >> $GITHUB_OUTPUT
            echo "tf_plan=$(get_config 'plan')" >> $GITHUB_OUTPUT
            echo "tf_apply=$(get_config 'apply')" >> $GITHUB_OUTPUT
            echo "tf_destroy=$(get_config 'destroy')" >> $GITHUB_OUTPUT
            
            # Notifications
            echo "slack=$(get_config 'slack')" >> $GITHUB_OUTPUT
            
            echo "## 📋 Pipeline Configuration (Dev)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Testes Unitários | $(get_config 'testes_unitarios') |" >> $GITHUB_STEP_SUMMARY
            echo "| SonarQube | $(get_config 'sonarqube') |" >> $GITHUB_STEP_SUMMARY
            echo "| Docker Build | $(get_config 'docker_build') |" >> $GITHUB_STEP_SUMMARY
            echo "| Terraform Init | $(get_config 'init') |" >> $GITHUB_STEP_SUMMARY
            echo "| Terraform Plan | $(get_config 'plan') |" >> $GITHUB_STEP_SUMMARY
            echo "| Terraform Apply | $(get_config 'apply') |" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ .iupipes not found, using defaults (all enabled)"
            echo "testes_unitarios=true" >> $GITHUB_OUTPUT
            echo "sonarqube=true" >> $GITHUB_OUTPUT
            echo "docker_build=true" >> $GITHUB_OUTPUT
            echo "security_scan=true" >> $GITHUB_OUTPUT
            echo "deploy_dev=true" >> $GITHUB_OUTPUT
            echo "testes_integracao=true" >> $GITHUB_OUTPUT
            echo "create_pr=true" >> $GITHUB_OUTPUT
            echo "tf_init=true" >> $GITHUB_OUTPUT
            echo "tf_plan=true" >> $GITHUB_OUTPUT
            echo "tf_apply=true" >> $GITHUB_OUTPUT
            echo "tf_destroy=false" >> $GITHUB_OUTPUT
            echo "slack=true" >> $GITHUB_OUTPUT
          fi

  # ============================================
  # STAGE 1: Unit Tests
  # ============================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: config
    if: needs.config.outputs.testes_unitarios == 'true'
    strategy:
      matrix:
        service:
          - portal-aluno
          - portal-professor
          - sistema-academico
          - video-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-unit-tests
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install pytest
        run: pip install pytest

      - name: Run Unit Tests - ${{ matrix.service }}
        run: |
          if [ -d "docker/${{ matrix.service }}/src/unit_tests" ]; then
            pytest docker/${{ matrix.service }}/src/unit_tests/ -v --tb=short --junitxml=test-results-${{ matrix.service }}.xml
          else
            echo "No unit tests found for ${{ matrix.service }}"
          fi

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results-${{ matrix.service }}
          path: test-results-${{ matrix.service }}.xml
          retention-days: 7

  # ============================================
  # STAGE 1.5: SonarQube Quality Analysis
  # ============================================
  sonarqube-analysis:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [config, unit-tests]
    if: |
      always() &&
      needs.config.outputs.sonarqube == 'true' &&
      (needs.unit-tests.result == 'success' || needs.unit-tests.result == 'skipped')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

      - name: Quality Summary
        if: always()
        run: |
          echo "## 🔍 SonarQube Quality Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Project:** everto18_uniplus_impacta" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Dashboard:** [View in SonarCloud](https://sonarcloud.io/project/overview?id=everto18_uniplus_impacta)" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # STAGE 2: Docker Pre-Build (Test Build)
  # ============================================
  docker-prebuild:
    name: Docker Pre-Build
    runs-on: ubuntu-latest
    needs: [config, unit-tests, sonarqube-analysis]
    if: |
      always() && 
      needs.config.outputs.docker_build == 'true' &&
      (needs.unit-tests.result == 'success' || needs.unit-tests.result == 'skipped') &&
      (needs.sonarqube-analysis.result == 'success' || needs.sonarqube-analysis.result == 'skipped')
    strategy:
      matrix:
        service:
          - portal-aluno
          - portal-professor
          - sistema-academico
          - video-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check if Dockerfile exists
        id: check-dockerfile
        run: |
          if [ -f "docker/${{ matrix.service }}/Dockerfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Docker Image (Test)
        if: steps.check-dockerfile.outputs.exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/${{ matrix.service }}/Dockerfile
          push: false
          tags: uniplus-${{ matrix.service }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Image Build Summary
        if: steps.check-dockerfile.outputs.exists == 'true'
        run: |
          echo "✅ Docker image for ${{ matrix.service }} built successfully!"
          docker images | grep uniplus-${{ matrix.service }} || true

  # ============================================
  # STAGE 3: Security Scan
  # ============================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [config, docker-prebuild]
    if: |
      always() &&
      needs.config.outputs.security_scan == 'true' &&
      (needs.docker-prebuild.result == 'success' || needs.docker-prebuild.result == 'skipped')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/dockerfile
          auditOn: push
        continue-on-error: true

      - name: Run Trivy Config Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'docker/'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
        continue-on-error: true

  # ============================================
  # STAGE 4: Deploy to Development
  # ============================================
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [config, docker-prebuild, security-scan]
    if: |
      always() &&
      needs.config.outputs.deploy_dev == 'true' &&
      (needs.docker-prebuild.result == 'success' || needs.docker-prebuild.result == 'skipped') &&
      (needs.security-scan.result == 'success' || needs.security-scan.result == 'skipped')
    environment:
      name: development
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Environment Variables
        id: env-vars
        run: |
          echo "ENVIRONMENT=dev" >> $GITHUB_ENV
          echo "BRANCH_NAME=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Images (using prebuild cache)
        run: |
          echo "## 🐳 Building Docker Images" >> $GITHUB_STEP_SUMMARY
          for service in portal-aluno portal-professor sistema-academico video-api; do
            if [ -f "docker/$service/Dockerfile" ]; then
              echo "Building $service (with cache)..."
              docker buildx build \
                --cache-from type=gha \
                --load \
                -t uniplus-$service:${{ github.sha }} \
                -t uniplus-$service:dev \
                -f docker/$service/Dockerfile .
              echo "- ✅ $service built" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Ensure ECR Repositories Exist
        if: needs.config.outputs.tf_apply == 'true'
        run: |
          for service in portal-aluno portal-professor sistema-academico video-api; do
            aws ecr describe-repositories --repository-names uniplus-$service 2>/dev/null || \
              aws ecr create-repository --repository-name uniplus-$service --image-scanning-configuration scanOnPush=true
          done

      - name: Push Images to ECR
        if: needs.config.outputs.tf_apply == 'true'
        run: |
          echo "## 📤 Pushing Images to ECR" >> $GITHUB_STEP_SUMMARY
          ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          for service in portal-aluno portal-professor sistema-academico video-api; do
            echo "Tagging and pushing $service..."
            docker tag uniplus-$service:${{ github.sha }} $ECR_REGISTRY/uniplus-$service:${{ github.sha }}
            docker tag uniplus-$service:dev $ECR_REGISTRY/uniplus-$service:dev
            docker push $ECR_REGISTRY/uniplus-$service:${{ github.sha }}
            docker push $ECR_REGISTRY/uniplus-$service:dev
            echo "- ✅ $service pushed" >> $GITHUB_STEP_SUMMARY
          done

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init
        working-directory: terraform/environments/dev

      - name: Terraform Plan
        run: |
          terraform plan -no-color -input=false -out=tfplan
        working-directory: terraform/environments/dev

      - name: Terraform Apply
        id: deploy
        if: needs.config.outputs.tf_apply == 'true'
        run: |
          terraform apply -auto-approve tfplan
          echo "deployed=true" >> $GITHUB_OUTPUT
        working-directory: terraform/environments/dev

      - name: Force ECS Service Update
        if: needs.config.outputs.tf_apply == 'true' && steps.deploy.outputs.deployed == 'true'
        run: |
          echo "## 🔄 Forcing ECS Service Update" >> $GITHUB_STEP_SUMMARY
          CLUSTER_NAME="uniplus-dev-cluster"
          for service in portal-aluno portal-professor sistema-academico video-api; do
            SERVICE_NAME="uniplus-dev-$service"
            if aws ecs describe-services --cluster $CLUSTER_NAME --services $SERVICE_NAME --query 'services[0].status' --output text 2>/dev/null | grep -q ACTIVE; then
              aws ecs update-service --cluster $CLUSTER_NAME --service $SERVICE_NAME --force-new-deployment
              echo "- 🔄 $service redeployed" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Skip Apply (Plan Only)
        id: skip-apply
        if: needs.config.outputs.tf_apply != 'true' && needs.config.outputs.tf_destroy != 'true'
        run: |
          echo "⏭️ Terraform Apply skipped (tf_apply=false in .iupipes)" >> $GITHUB_STEP_SUMMARY
          echo "deployed=false" >> $GITHUB_OUTPUT

      - name: Validate Destroy Request
        if: needs.config.outputs.tf_destroy == 'true'
        run: |
          if [ "${{ needs.config.outputs.tf_apply }}" == "true" ]; then
            echo "❌ ERROR: Cannot have both apply=true and destroy=true" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "## ⚠️ DESTROY REQUESTED" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The following resources will be **PERMANENTLY DELETED**:" >> $GITHUB_STEP_SUMMARY
          echo "- ECR repositories and all images" >> $GITHUB_STEP_SUMMARY
          echo "- ECS clusters and services" >> $GITHUB_STEP_SUMMARY
          echo "- RDS database" >> $GITHUB_STEP_SUMMARY
          echo "- VPC and networking" >> $GITHUB_STEP_SUMMARY
          echo "- S3 buckets (with content)" >> $GITHUB_STEP_SUMMARY

      - name: Terraform Destroy
        id: destroy
        if: needs.config.outputs.tf_destroy == 'true'
        run: |
          echo "🔥 Starting Terraform Destroy..."
          terraform destroy -auto-approve
          echo "destroyed=true" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🗑️ Infrastructure Destroyed" >> $GITHUB_STEP_SUMMARY
          echo "All resources have been permanently removed." >> $GITHUB_STEP_SUMMARY
        working-directory: terraform/environments/dev

      - name: Deploy Summary
        if: needs.config.outputs.tf_destroy != 'true'
        run: |
          echo "## 🚀 Development Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ env.BRANCH_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ env.SHORT_SHA }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** Development" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # STAGE 5: Integration Tests TAAC
  # ============================================
  integration-tests-dev:
    name: Integration Tests (TAAC)
    runs-on: ubuntu-latest
    needs: deploy-dev
    if: needs.deploy-dev.outputs.deployed == 'true'
    outputs:
      tests_passed: ${{ steps.tests.outputs.passed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-integration-tests
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install Dependencies
        run: pip install -r tests/requirements.txt

      - name: Run TAAC Integration Tests
        id: tests
        env:
          ENVIRONMENT: dev
          PROJECT_NAME: uniplus
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          set +e
          pytest tests/ \
            -v \
            --tb=short \
            -m "infrastructure or integration" \
            --junitxml=integration-test-results.xml \
            --ignore=tests/conftest.py
          TEST_EXIT_CODE=$?
          set -e
          
          if [ $TEST_EXIT_CODE -eq 0 ]; then
            echo "passed=true" >> $GITHUB_OUTPUT
            echo "✅ All integration tests passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "passed=false" >> $GITHUB_OUTPUT
            echo "❌ Some integration tests failed" >> $GITHUB_STEP_SUMMARY
          fi
          exit $TEST_EXIT_CODE

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results-dev
          path: integration-test-results.xml
          retention-days: 30

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: 'integration-test-results.xml'
          fail_on_failure: false
          require_tests: false

      - name: Test Summary
        if: always()
        run: |
          echo "## 🧪 TAAC Integration Tests (Development)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** dev" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ steps.tests.outputs.passed == 'true' && '✅ Passed' || '❌ Failed' }}" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # STAGE 6: Create Pull Request to Main
  # ============================================
  create-pr:
    name: Create PR to Main
    runs-on: ubuntu-latest
    needs: [deploy-dev, integration-tests-dev]
    if: |
      needs.deploy-dev.outputs.deployed == 'true' &&
      needs.integration-tests-dev.outputs.tests_passed == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Branch Info
        id: branch-info
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "pr_title=🚀 Deploy to Production: $BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Check for Existing PR
        id: check-pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${{ steps.branch-info.outputs.branch_name }}`,
              base: 'main'
            });
            
            if (prs.length > 0) {
              console.log(`PR already exists: #${prs[0].number}`);
              core.setOutput('exists', 'true');
              core.setOutput('pr_number', prs[0].number);
            } else {
              core.setOutput('exists', 'false');
            }

      - name: Create Pull Request
        if: steps.check-pr.outputs.exists == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branchName = '${{ steps.branch-info.outputs.branch_name }}';
            const prTitle = '${{ steps.branch-info.outputs.pr_title }}';
            
            const body = `## 🎯 Pull Request para Produção

            ### Origem
            - **Branch:** \`${branchName}\`
            - **Commit:** \`${{ github.sha }}\`
            - **Autor:** @${{ github.actor }}

            ### ✅ Validações Realizadas
            - [x] Testes unitários passaram
            - [x] Build do Docker realizado com sucesso
            - [x] Scan de segurança executado
            - [x] Deploy no ambiente de desenvolvimento bem-sucedido

            ### 📋 Checklist para Aprovação
            - [ ] Código revisado
            - [ ] Testes de integração verificados
            - [ ] Documentação atualizada (se aplicável)
            - [ ] Aprovado por pelo menos 1 revisor

            ---
            *Este PR foi criado automaticamente pelo CI/CD Pipeline.*`;

            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: prTitle,
              head: branchName,
              base: 'main',
              body: body
            });

            console.log(`Created PR #${pr.number}`);
            
            // Add labels
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: ['auto-pr', 'ready-for-review', 'deploy-prod']
            });

      - name: PR Summary
        run: |
          echo "## 📝 Pull Request" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check-pr.outputs.exists }}" == "true" ]; then
            echo "PR já existe: #${{ steps.check-pr.outputs.pr_number }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "Novo PR criado para merge em **main**" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Validações Realizadas" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Testes unitários" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Build Docker" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Scan de segurança" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Deploy em desenvolvimento" >> $GITHUB_STEP_SUMMARY
          echo "- [x] **Testes de integração TAAC**" >> $GITHUB_STEP_SUMMARY
