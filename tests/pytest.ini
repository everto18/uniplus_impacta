[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --color=yes
markers =
    infrastructure: Tests that validate AWS infrastructure
    s3: Tests for S3 buckets
    lambda_fn: Tests for Lambda functions
    stepfunctions: Tests for Step Functions
    sqs: Tests for SQS queues
    iam: Tests for IAM roles and policies
    integration: Integration tests (requires AWS credentials)
