version: '3.8'

services:
  portal-aluno:
    build:
      context: .
      dockerfile: docker/portal-aluno/Dockerfile
    ports:
      - "8081:8080"
    environment:
      - APP_ENV=local
      - APP_BASE_PATH=
    networks:
      - uniplus

  portal-professor:
    build:
      context: .
      dockerfile: docker/portal-professor/Dockerfile
    ports:
      - "8082:8080"
    environment:
      - APP_ENV=local
      - APP_BASE_PATH=
    networks:
      - uniplus

  sistema-academico:
    build:
      context: .
      dockerfile: docker/sistema-academico/Dockerfile
    ports:
      - "8083:8080"
    environment:
      - APP_ENV=local
      - APP_BASE_PATH=
    networks:
      - uniplus

  video-api:
    build:
      context: .
      dockerfile: docker/video-api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - APP_ENV=local
    networks:
      - uniplus

networks:
  uniplus:
    driver: bridge
